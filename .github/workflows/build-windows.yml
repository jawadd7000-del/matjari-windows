name: Build Matjari Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        shell: pwsh
        run: |
          Expand-Archive -Path matjari-windows-project.zip -DestinationPath . -Force

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: matjari-windows
        run: npm install

      - name: Build EXE
        working-directory: matjari-windows
        run: npm run dist

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Matjari-Windows-Installer
          path: matjari-windows/dist/*.exe
          if-no-files-found: error
          retention-days: 30
